services:
  dashboard:
    build: .
    ports:
      - "8501:8501"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      CVE_LIST_PATH: /app/data/cvelistV5
      SEED_DEMO: "1"
      SOC_USER: ${SOC_USER:-soc}
      SOC_PASSWORD: ${SOC_PASSWORD:-}
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  worker:
    build: .
    command: python scripts/run_worker.py
    healthcheck:
      disable: true
    environment:
      DATABASE_URL: ${DATABASE_URL}
      CVE_LIST_PATH: /app/data/cvelistV5
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    stop_grace_period: 2m
    depends_on:
      dashboard:
        condition: service_started
