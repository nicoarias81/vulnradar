# Open sources
sources:
  cve_list:
    type: git
    url: https://github.com/CVEProject/cvelistV5.git
    path: data/cvelistV5

  kev:
    type: json
    url: https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json

  epss:
    type: csv_gz
    url: https://epss.empiricalsecurity.com/epss_scores-current.csv.gz

  rss:
    # Specialist press: headline, publisher and explicit CVE mentions for Hype.
    - https://www.theregister.com/security/headlines.atom
    - https://www.infosecurity-magazine.com/rss/news/
    - https://securityaffairs.com/feed
    - https://www.csoonline.com/feed/
    - https://unaaldia.hispasec.com/feed
    - https://feeds.feedburner.com/TheHackersNews
    - https://www.bleepingcomputer.com/feed/
    - https://www.securityweek.com/feed/
    - https://www.helpnetsecurity.com/feed/
    - https://therecord.media/feed
    - https://www.darkreading.com/rss.xml
    # Newly published CVEs with the ID and the product in the headline
    # ("CVE-2026-120075 - WP Activity Log <= 5.6.1 - ..."): the only feed that
    # hands the rerank an explicit CVE. nvd-rss-analyzed.xml died (404) and the
    # CISA one answers 403.
    - https://cvefeed.io/rssfeed/latest.xml
    # Vendor and research blogs: they carry the CVE in the headline and explain
    # the mechanism, which general press feeds do not give you.
    - https://blog.talosintelligence.com/rss/
    - https://www.zerodayinitiative.com/blog?format=rss
    - https://unit42.paloaltonetworks.com/feed/
    - https://googleprojectzero.blogspot.com/feeds/posts/default
    - https://security.googleblog.com/feeds/posts/default
    - https://blog.cloudflare.com/rss/
    - https://www.tenable.com/blog/feed
    - https://krebsonsecurity.com/feed/
    - https://cyberscoop.com/feed/
    - https://labs.watchtowr.com/rss/
    - https://www.horizon3.ai/feed/
    - https://research.checkpoint.com/feed/
    - https://cloudblog.withgoogle.com/topics/threat-intelligence/rss/
    - https://www.rapid7.com/blog/rss/
    - https://portswigger.net/research/rss
    - https://www.sonarsource.com/blog/rss.xml
    - https://isc.sans.edu/rssfeed_full.xml
    - https://www.sentinelone.com/labs/feed/

  # Advisories that already carry the CVE in the headline: they skip the model.
  # The rerank costs one call per entry and here the headline regex is enough.
  # Includes large catalogues (MSRC lists every Patch Tuesday): the per-run cap
  # takes the recent stretch and the upsert discards what has already been seen.
  rss_regex_only:
    # Primary technical advisories: these add context, not press coverage.
    - https://ubuntu.com/security/notices/rss.xml
    - https://www.debian.org/security/dsa-long
    - https://cert.cyber.gouv.fr/avis/feed/
    - https://www.kb.cert.org/vuls/atomfeed/
    - https://api.msrc.microsoft.com/update-guide/rss
    - https://sec.cloudapps.cisco.com/security/center/psirtrss20/CiscoSecurityAdvisory.xml
    - https://www.zerodayinitiative.com/rss/published/
    - https://security.paloaltonetworks.com/rss.xml
    - https://www.ivanti.com/blog/topics/security-advisory/rss
    - https://www.fortiguard.com/rss/ir.xml
    - https://www.cert.ssi.gouv.fr/alerte/feed/
    - https://www.incibe.es/incibe-cert/alerta-temprana/avisos/feed
    - https://cert.europa.eu/publications/security-advisories-rss
    - https://www.exploit-db.com/rss.xml

  # Every entry goes through the LLM: it discards anything that is not a
  # concrete vulnerability, resolves the CVE from the text and stores the
  # headline nickname (Log4Shell) as brand_name. Turn it off if the LLM is down.
  rerank_feeds: true

  github_search:
    enabled: true
    # {cve_id} is replaced with the full CVE; enrichment fires it exactly as is.
    query_template: "{cve_id} poc"

  # Press coverage for the CVEs that matter even when they are not in today's
  # feeds: KEV ones, ones with PoCs and freshly published ones. Google News
  # answers 503 from the VPS, so the cycle falls back to Hacker News (Algolia).
  attention:
    enabled: true
    limit: 15

