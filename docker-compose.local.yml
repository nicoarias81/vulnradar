# Ambiente local con blue-green real: Caddy publica 8500 y enruta al slot
# activo (dashboard-a o dashboard-b). Los slots se publican en 8511/8512 sólo
# para inspección directa; el tráfico público no pasa por ahí.
# Uso: ./scripts/ab.sh up | deploy | status | rollback

services:
  postgres:
    image: postgres:16-alpine
    container_name: vulnradar-pg-local
    environment:
      POSTGRES_USER: vuln
      POSTGRES_PASSWORD: vuln
      POSTGRES_DB: vulnradar
    ports:
      - "5433:5432"
    volumes:
      - pgdata-local:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vuln -d vulnradar"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  dashboard-a:
    build: .
    container_name: vulnradar-a
    ports:
      - "127.0.0.1:8511:8501"
    environment:
      DATABASE_URL: postgresql://vuln:vuln@postgres:5432/vulnradar
      CVE_LIST_PATH: /app/data/cvelistV5
      SEED_DEMO: "1"
      SLOT: a
      SOC_USER: ${SOC_USER:-soc}
      SOC_PASSWORD: ${SOC_PASSWORD:-soc-local}
      LLM_PROVIDER: ${LLM_PROVIDER:-none}
    volumes:
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/health')"]
      interval: 15s
      timeout: 5s
      # El dashboard tarda ~2 min en quedar listo: con start_period corto se
      # marcaba unhealthy mientras todavía estaba arrancando.
      start_period: 240s
      retries: 3

  dashboard-b:
    build: .
    container_name: vulnradar-b
    ports:
      - "127.0.0.1:8512:8501"
    environment:
      DATABASE_URL: postgresql://vuln:vuln@postgres:5432/vulnradar
      CVE_LIST_PATH: /app/data/cvelistV5
      SEED_DEMO: "0"
      SLOT: b
      SOC_USER: ${SOC_USER:-soc}
      SOC_PASSWORD: ${SOC_PASSWORD:-soc-local}
      LLM_PROVIDER: ${LLM_PROVIDER:-none}
    volumes:
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/health')"]
      interval: 15s
      timeout: 5s
      # El dashboard tarda ~2 min en quedar listo: con start_period corto se
      # marcaba unhealthy mientras todavía estaba arrancando.
      start_period: 240s
      retries: 3

  proxy:
    image: caddy:2-alpine
    container_name: vulnradar-proxy
    ports:
      - "127.0.0.1:8500:8500"
    environment:
      LISTEN_PORT: "8500"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./deploy/upstream.caddy:/etc/caddy/upstream.caddy:ro
      - caddy_data:/data
    depends_on:
      - dashboard-a
    restart: unless-stopped

volumes:
  pgdata-local:
  caddy_data:
