# Production — personal-1 (Hetzner CAX21, ARM64), reachable only through the Cloudflare Tunnel.
#
#   bash deploy/deploy.sh        (blue-green: brings up the idle slot and moves traffic)
#
# - `proxy` (Caddy) publishes 127.0.0.1:8501, which is what the tunnel consumes,
#   and routes to the active slot (dashboard-a:8511 or dashboard-b:8512).
# - The slots are NOT published publicly: loopback only, for inspection.
# - `default` = bridge with outbound internet (worker: git/CISA/EPSS/RSS/GitHub).
# - `litellm` = `internal` network shared with the LiteLLM from /opt/stack.
# - `../data` (bind mount) holds the cvelistV5 mirror: NEVER overwrite it with git archive.
# - The DB is external PostgreSQL (`DATABASE_URL` in `.env.prod`).

name: vulnradar

services:
  dashboard-a: &slot
    build:
      context: ..
    image: vulnradar:latest
    env_file:
      - .env.prod
    environment:
      CVE_LIST_PATH: /app/data/cvelistV5
      SEED_DEMO: "0"
      LLM_BASE_URL: http://litellm:4000/v1
      TZ: Europe/Madrid
      SLOT: a
    ports:
      - "127.0.0.1:8511:8501"
    volumes:
      - ../data:/app/data
    networks: [default, litellm, db]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/health')"]
      interval: 30s
      timeout: 5s
      # It boots in ~2 min; with 20s it was marked unhealthy while still loading.
      start_period: 240s
      retries: 3

  dashboard-b:
    <<: *slot
    environment:
      CVE_LIST_PATH: /app/data/cvelistV5
      SEED_DEMO: "0"
      LLM_BASE_URL: http://litellm:4000/v1
      TZ: Europe/Madrid
      SLOT: b
    ports:
      - "127.0.0.1:8512:8501"

  # Caddy publishes the port the tunnel consumes (8501) and routes to the
  # active slot. The switch is an atomic reload: connections in flight finish
  # against the previous slot, so a deploy does not drop the site.
  proxy:
    image: caddy:2-alpine
    ports:
      - "127.0.0.1:8501:8501"
    environment:
      LISTEN_PORT: "8501"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./upstream.caddy:/etc/caddy/upstream.caddy:ro
      - caddy_data:/data
    networks: [default]
    restart: unless-stopped

  worker:
    image: vulnradar:latest
    command: ["python", "scripts/run_worker.py"]
    env_file:
      - .env.prod
    environment:
      CVE_LIST_PATH: /app/data/cvelistV5
      LLM_BASE_URL: http://litellm:4000/v1
      TZ: Europe/Madrid
    volumes:
      - ../data:/app/data
    networks: [default, litellm, db]
    restart: unless-stopped
    # A sync/enrich cycle can take a while; don't let SIGTERM cut a write short.
    stop_grace_period: 2m
    healthcheck:
      disable: true
    depends_on:
      dashboard-a:
        condition: service_started

volumes:
  caddy_data:

networks:
  default: {}
  litellm:
    external: true
    name: internal
  db:
    external: true
    name: db
