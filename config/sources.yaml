# Fuentes abiertas
sources:
  cve_list:
    type: git
    url: https://github.com/CVEProject/cvelistV5.git
    path: data/cvelistV5

  kev:
    type: json
    url: https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json

  epss:
    type: csv_gz
    url: https://epss.empiricalsecurity.com/epss_scores-current.csv.gz

  rss:
    - https://feeds.feedburner.com/TheHackersNews
    - https://www.bleepingcomputer.com/feed/
    - https://www.securityweek.com/feed/
    - https://www.helpnetsecurity.com/feed/
    - https://therecord.media/feed
    - https://www.darkreading.com/rss.xml
    # CVEs recién publicados con el ID y el producto en el titular
    # ("CVE-2026-120075 - WP Activity Log <= 5.6.1 - ..."): es el único feed que
    # le da al rerank un CVE explícito. nvd-rss-analyzed.xml murió (404) y el de
    # CISA responde 403.
    - https://cvefeed.io/rssfeed/latest.xml

  # Cada entrada pasa por el LLM: descarta lo que no es una vulnerabilidad
  # concreta, resuelve el CVE del texto y guarda el apodo del titular
  # (Log4Shell) como brand_name. Apagalo si el LLM no está disponible.
  rerank_feeds: true

  github_search:
    enabled: true
    # {cve_id} se reemplaza por el CVE completo; el enrich lo lanza así tal cual.
    query_template: "{cve_id} poc"
