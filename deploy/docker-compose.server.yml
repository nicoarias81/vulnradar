# Producción — personal-1 (Hetzner CAX21, ARM64), acceso sólo por Cloudflare Tunnel.
#
#   bash deploy/deploy.sh        (blue-green: levanta el slot inactivo y mueve el tráfico)
#
# - `proxy` (Caddy) publica 127.0.0.1:8501, que es lo que consume el túnel, y
#   enruta al slot activo (dashboard-a:8511 o dashboard-b:8512).
# - Los slots NO se publican al público: sólo en loopback para inspección.
# - `default` = bridge con salida a internet (worker: git/CISA/EPSS/RSS/GitHub).
# - `litellm` = red `internal` compartida con el LiteLLM de /opt/stack.
# - `../data` (bind mount) guarda el mirror cvelistV5: NUNCA se pisa con git archive.
# - La DB es PostgreSQL externo (`DATABASE_URL` en `.env.prod`).

name: vulnradar

services:
  dashboard-a: &slot
    build:
      context: ..
    image: vulnradar:latest
    env_file:
      - .env.prod
    environment:
      CVE_LIST_PATH: /app/data/cvelistV5
      SEED_DEMO: "0"
      LLM_BASE_URL: http://litellm:4000/v1
      TZ: Europe/Madrid
      SLOT: a
    ports:
      - "127.0.0.1:8511:8501"
    volumes:
      - ../data:/app/data
    networks: [default, litellm, db]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/health')"]
      interval: 30s
      timeout: 5s
      # Arranca en ~2 min; con 20s quedaba unhealthy mientras todavía cargaba.
      start_period: 240s
      retries: 3

  dashboard-b:
    <<: *slot
    environment:
      CVE_LIST_PATH: /app/data/cvelistV5
      SEED_DEMO: "0"
      LLM_BASE_URL: http://litellm:4000/v1
      TZ: Europe/Madrid
      SLOT: b
    ports:
      - "127.0.0.1:8512:8501"

  # Caddy publica el puerto que consume el túnel (8501) y enruta al slot
  # activo. El switch es un reload atómico: las conexiones en curso terminan
  # contra el slot anterior, así que un deploy no corta el sitio.
  proxy:
    image: caddy:2-alpine
    ports:
      - "127.0.0.1:8501:8501"
    environment:
      LISTEN_PORT: "8501"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./upstream.caddy:/etc/caddy/upstream.caddy:ro
      - caddy_data:/data
    networks: [default]
    restart: unless-stopped

  worker:
    image: vulnradar:latest
    command: ["python", "scripts/run_worker.py"]
    env_file:
      - .env.prod
    environment:
      CVE_LIST_PATH: /app/data/cvelistV5
      LLM_BASE_URL: http://litellm:4000/v1
      TZ: Europe/Madrid
    volumes:
      - ../data:/app/data
    networks: [default, litellm, db]
    restart: unless-stopped
    # Un ciclo de sync/enrich puede tardar; que el SIGTERM no corte una escritura.
    stop_grace_period: 2m
    healthcheck:
      disable: true
    depends_on:
      dashboard-a:
        condition: service_started

volumes:
  caddy_data:

networks:
  default: {}
  litellm:
    external: true
    name: internal
  db:
    external: true
    name: db
